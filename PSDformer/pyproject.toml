[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psdformer-reference"
version = "0.1.0"
description = "Independent PyTorch reference implementation of the supplied PSDformer manuscript"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.2,<3"]

[project.scripts]
psdformer = "psdformer.__main__:main"

[tool.setuptools.packages.find]
include = ["psdformer*"]

[tool.setuptools.package-data]
psdformer = ["configs/*.json"]
